<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Chat Room - Talkomatic</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Default UI font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="stylesheets/room.css?v=2.7.0" />
    <link rel="stylesheet" href="stylesheets/games.css?v=3.11.0" />
    <!-- Applies the saved custom theme before first paint -->
    <link rel="stylesheet" href="stylesheets/effects.css?v=1.2.0" />
    <script src="js/theme-engine.js?v=2.2.0"></script>
    <link rel="icon" type="image/png" href="images/icons/favicon.png" />
    <style>
      /* Emote system */
      .emote-autocomplete {
        position: absolute;
        z-index: 1000;
        background-color: #333;
        border: 1px solid #555;
        border-radius: 4px;
        max-height: 300px;
        overflow-y: auto;
        width: 200px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        display: none;
      }
      .emote-autocomplete-header {
        padding: 5px 10px;
        font-weight: bold;
        border-bottom: 1px solid #555;
        color: #eee;
      }
      .emote-autocomplete-list {
        max-height: 250px;
        overflow-y: auto;
      }
      .emote-autocomplete-item {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        cursor: pointer;
        border-bottom: 1px solid #444;
        color: #fff;
      }
      .emote-autocomplete-item.selected,
      .emote-autocomplete-item:hover {
        background-color: #555;
      }
      .emote-autocomplete-item img {
        width: auto;
        height: 20px;
        margin-right: 10px;
        vertical-align: middle;
      }
      .chat-input {
        background-color: var(--tk-chat-bg, #000) !important;
        color: var(--tk-chat-text, orange) !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        outline: none !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
      }
      .emote {
        display: inline-block;
        vertical-align: middle;
        width: auto;
        height: 20px;
        margin: 0 2px;
      }

      /* App directory */
      .app-directory-toggle {
        background: none;
        border: none;
        color: var(--tk-text);
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-family: inherit;
        transition: background-color 0.2s ease;
        margin: 0 2px;
        margin-right: 8px;
      }
      .app-directory-toggle:hover {
        background-color: color-mix(in srgb, var(--tk-accent) 10%, transparent);
      }
      .app-directory-toggle img {
        width: 18px;
        height: 18px;
      }
      .app-directory-dropdown {
        position: absolute;
        top: 100%;
        right: 120px;
        background-color: var(--tk-bg);
        border: 1px solid var(--tk-border);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 10000;
        min-width: 280px;
        max-width: 320px;
        display: none;
        padding: 1rem;
        margin-top: 5px;
        /* The list has outgrown short windows, so let it scroll instead of
           running off the bottom of the screen. */
        max-height: min(70vh, 560px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .app-directory-dropdown::-webkit-scrollbar {
        width: 8px;
      }
      .app-directory-dropdown::-webkit-scrollbar-track {
        background: transparent;
      }
      .app-directory-dropdown::-webkit-scrollbar-thumb {
        background: var(--tk-border);
        border-radius: 4px;
      }
      .app-directory-dropdown::-webkit-scrollbar-thumb:hover {
        background: var(--tk-accent);
      }
      .app-directory-dropdown.show {
        display: block;
        animation: fadeInDown 0.2s ease-out;
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .app-directory-header {
        color: var(--tk-accent);
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--tk-border);
      }
      .app-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .app-item {
        display: flex;
        align-items: center;
        padding: 12px;
        border-radius: 6px;
        background-color: var(--tk-card);
        border: 1px solid var(--tk-border);
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        color: var(--tk-text);
      }
      .app-item:hover {
        border-color: var(--tk-accent);
        background-color: var(--tk-tile);
        transform: translateY(-1px);
      }
      .app-item.disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .app-item.disabled:hover {
        border-color: var(--tk-border);
        background-color: var(--tk-card);
        transform: none;
      }
      .app-icon {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        margin-right: 12px;
        object-fit: cover;
      }
      .app-icon.watchparty {
        padding: 4px;
      }
      .app-icon.placeholder {
        background: linear-gradient(135deg, var(--tk-accent), #ff8c42);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #000000;
      }
      .app-info {
        flex: 1;
      }
      .app-name {
        font-size: 14px;
        font-weight: bold;
        color: var(--tk-text);
        margin-bottom: 2px;
      }
      .app-description {
        font-size: 12px;
        color: #cccccc;
        line-height: 1.3;
      }
      @media (max-width: 768px) {
        .app-directory-dropdown {
          right: 10px;
          left: 10px;
          width: auto;
          min-width: auto;
          max-width: none;
        }
        .app-directory-toggle {
          margin-right: 8px;
          margin-left: 0;
        }
        .app-directory-toggle span {
          display: none;
        }
      }
      #layoutToggle {
        font-size: 18px;
        color: #fff;
      }
      #changeNameToggle {
        font-size: 16px;
        color: #fff;
      }

      .user-info button.staff-action-button i.fas {
        color: rgb(201, 201, 201) !important;
      }
      .user-info button.note-action-button.has-note i.fas {
        color: #ffb74d !important;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <nav class="top-navbar">
        <div class="navbar-section navbar-left">
          <div id="dateTime" class="date-time">
            <span class="date"></span>
            <span class="time"></span>
          </div>
        </div>
        <div class="navbar-section navbar-right">
          <button id="muteToggle" class="mute-toggle" aria-label="Toggle Sound">
            <img src="images/icons/sound-on.svg" alt="Sound On" id="muteIcon" />
          </button>
          <button
            id="layoutToggle"
            class="mute-toggle"
            aria-label="Switch layout"
            title="Toggle layout"
            style="display: none"
          >
            <i class="fas fa-bars"></i>
          </button>
          <button
            id="appDirectoryToggle"
            class="app-directory-toggle"
            aria-label="Open App Directory"
          >
            <img src="images/icons/apps.png" alt="Apps" id="appDirectoryIcon" />
            <span>Apps</span>
          </button>
          <button
            id="changeNameToggle"
            class="mute-toggle"
            aria-label="Change name"
            title="Change name"
          >
            <i class="fas fa-user-pen"></i>
          </button>
        </div>
      </nav>
      <div class="chat-container"></div>
    </div>

    <!-- Emote autocomplete container -->
    <div id="emoteAutocomplete" class="emote-autocomplete"></div>

    <!-- Name entry: shown on first visit (no saved name) and reopened by the
         "Change name" button. Not the shared #customModal - that input is
         digit-only (access codes), and this needs to be visible before the
         rest of the modal system's wiring necessarily applies. -->
    <div id="nameEntryModal" class="custom-modal">
      <div class="modal-content">
        <h3>What's your name?</h3>
        <div id="nameEntryInputContainer">
          <input
            type="text"
            id="nameEntryInput"
            maxlength="15"
            autocomplete="off"
            placeholder="Your name"
          />
          <p class="input-error" id="nameEntryError"></p>
        </div>
        <div class="modal-buttons">
          <button id="nameEntryConfirmBtn" class="modal-btn modal-confirm-btn">
            Join
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="custom-modal">
      <div class="modal-content">
        <span class="close-modal-btn">&times;</span>
        <h3 id="modalTitle">Modal Title</h3>
        <p id="modalMessage">Modal message goes here.</p>
        <div id="modalInputContainer" style="display: none">
          <input
            type="text"
            id="modalInput"
            maxlength="6"
            pattern="[0-9]*"
            inputmode="numeric"
          />
          <p class="input-error" id="modalInputError"></p>
        </div>
        <div class="modal-buttons">
          <button id="modalCancelBtn" class="modal-btn">Cancel</button>
          <button id="modalConfirmBtn" class="modal-btn modal-confirm-btn">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <audio id="joinSound" src="audio/ding.mp3"></audio>
    <audio id="leaveSound" src="audio/ding.mp3"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <!-- Shared staff UI kit (modals, menus, toasts) -->
    <script src="js/staff-ui.js?v=1.8.1"></script>
    <script src="js/desk.js?v=1.0.0"></script>
    <script src="js/word-filter-client.js?v=2.1.3"></script>
    <script src="js/identity.js?v=1.0.2"></script>
    <script src="js/connection-overlay.js?v=1.2.0"></script>
    <script src="js/room-client.js?v=3.18.0"></script>
    <script src="js/talkoboard.js?v=1.6.4"></script>
    <script src="js/piano-client.js?v=2.1.13"></script>
    <script src="js/puzzle-client.js?v=1.1.0"></script>
    <script src="js/theme-editor.js?v=2.2.0"></script>

    <script src="js/games-client.js?v=4.12.0"></script>
  </body>
</html>
