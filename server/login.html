<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>chatroom - sign in</title>
    <link rel="icon" type="image/png" href="images/icons/favicon.png" />
    <!-- Self-contained on purpose: everything else under public/ sits behind
         the gate this page is the way through (bar the fonts, which server.js
         lets through). Tokens and styling mirror the default theme in
         room.css - the card is its .modal-content / #modalTitle / #modalInput /
         .modal-confirm-btn. -->
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format("woff2");
      }
      @font-face {
        font-family: "talkoText";
        src: url(/fonts/dited.otf);
      }
      :root {
        --tk-accent: #ff9800;
        --tk-bg: #202020;
        --tk-text: #ffffff;
        --tk-muted: #cccccc;
        --tk-border: #616161;
        --tk-card: #000000;
        --tk-font-main: "Inter", Arial, sans-serif;
        --tk-font-chat: "Inter", talkoText, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: var(--tk-text); }
      body {
        font: 16px/1.5 var(--tk-font-main);
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      form {
        width: min(24rem, 100%);
        display: grid;
        gap: 14px;
        background: var(--tk-bg);
        border: 1px solid var(--tk-accent);
        border-radius: 8px;
        box-shadow: 0 0 20px color-mix(in srgb, var(--tk-accent) 50%, transparent);
        padding: 24px;
      }
      h1 {
        margin: 0 0 6px;
        color: var(--tk-accent);
        font-size: 1.25rem;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      label { display: grid; gap: 6px; color: var(--tk-muted); font-size: 14px; }
      input {
        width: 100%;
        padding: 12px;
        background: var(--tk-card);
        border: 1px solid #444;
        border-radius: 4px;
        color: var(--tk-accent);
        font-family: var(--tk-font-chat);
        font-size: 18px;
        transition: border-color 0.3s;
      }
      input:focus {
        border-color: var(--tk-accent);
        outline: none;
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--tk-accent) 30%, transparent);
      }
      .error { color: #ff5252; font-size: 14px; margin: 0; min-height: 1.5em; }
      button {
        justify-self: end;
        min-width: 80px;
        padding: 10px 18px;
        border-radius: 5px;
        background: var(--tk-card);
        color: var(--tk-text);
        border: 1px solid var(--tk-accent);
        font: 15px var(--tk-font-main);
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover, button:focus-visible {
        background: var(--tk-accent);
        color: #000;
        transform: translateY(-2px);
      }
      button:focus-visible { outline: 1px solid var(--tk-accent); outline-offset: 2px; }
      button:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>TALKOMATIC</h1>
      <label>name
        <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      </label>
      <label>password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <input type="hidden" name="next" value="{{next}}" />
      <p class="error" role="alert">{{error}}</p>
      <button type="submit">sign in</button>
    </form>
  </body>
</html>
