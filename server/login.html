<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>chatroom - sign in</title>
    <link rel="icon" type="image/png" href="images/icons/favicon.png" />
    <!-- Self-contained on purpose: everything else under public/ sits behind
         the gate this page is the way through. -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: #eee; }
      body {
        font: 16px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      form {
        width: min(22rem, 100%);
        display: grid;
        gap: 0.75rem;
        border: 1px solid #444;
        padding: 1.5rem;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.25rem; font-weight: normal; letter-spacing: 0.05em; }
      label { display: grid; gap: 0.25rem; color: #aaa; font-size: 0.875rem; }
      input {
        font: inherit;
        color: #fff;
        background: #111;
        border: 1px solid #555;
        padding: 0.5rem;
      }
      input:focus { outline: 2px solid #fff; outline-offset: 1px; }
      button {
        font: inherit;
        background: #eee;
        color: #000;
        border: 0;
        padding: 0.5rem;
        cursor: pointer;
      }
      button:hover, button:focus { background: #fff; }
      .error { color: #ff6b6b; margin: 0; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>TALKOMATIC</h1>
      <label>name
        <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      </label>
      <label>password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <input type="hidden" name="next" value="{{next}}" />
      <p class="error" role="alert">{{error}}</p>
      <button type="submit">sign in</button>
    </form>
  </body>
</html>
