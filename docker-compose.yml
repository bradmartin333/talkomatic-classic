services:
  talkomatic:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Set these in a .env file next to this compose file (see .env.example)
      - SESSION_SECRET=${SESSION_SECRET:-}
      - TALKOMATIC_API_KEY=${TALKOMATIC_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - DEV_KEY_HASH=${DEV_KEY_HASH:-}
      - TALKOMATIC_METRICS_TOKEN=${TALKOMATIC_METRICS_TOKEN:-}
    volumes:
      - talkomatic-data:/app/data
    restart: unless-stopped

volumes:
  talkomatic-data:
